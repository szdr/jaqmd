name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチ/PRの古い実行をキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限（requires-python）と開発時のバージョンの両端を検証する
        python-version: ["3.11", "3.14"]
    env:
      # .python-version を上書きし、matrix のバージョンで venv を作らせる
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv の版が勝手に上がらないよう固定する（v0.2.0 のリリースで検証済み）。
          # なお setup-uv はダウンロード URL の解決で versions manifest を引くため、
          # ピンしても外部 fetch 自体はなくならない。
          version: "0.12.0"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run checks (lint + fmt-check + test)
        run: just check
